<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tracking Order - Zolix</title>
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body class="tracking-body">
    <main class="tracking-page">
      <header class="tracking-header">
        <div class="brand">
          <img class="brand-logo" src="/assets/logo.png" alt="Zolix Shoe Care">
        </div>
        <a class="secondary-button" id="whatsapp-link" href="#">WhatsApp</a>
      </header>

      <section class="tracking-hero">
        <div class="tracking-hero-copy">
          <span class="tracking-eyebrow">Tracking Order</span>
          <h1 id="invoice-title">Memuat...</h1>
          <p id="customer-line">Mohon tunggu sebentar.</p>
        </div>
        <div class="tracking-hero-side">
          <div id="tracking-status"></div>
          <div class="tracking-overview" id="tracking-overview"></div>
        </div>
      </section>

      <section class="tracking-grid">
        <article class="panel tracking-card">
          <div class="panel-head">
            <div>
              <h2>Timeline Progress</h2>
              <p>Status pengerjaan sepatu Anda.</p>
            </div>
          </div>
          <div class="timeline" id="tracking-timeline"></div>
        </article>

        <article class="panel tracking-card">
          <div class="panel-head">
            <div>
              <h2>Nota Pembayaran</h2>
              <p>Detail layanan dan total invoice.</p>
            </div>
          </div>
          <div class="invoice-summary" id="invoice-summary"></div>
        </article>
      </section>

      <section class="panel tracking-card">
        <div class="panel-head">
          <div>
            <h2>Pembayaran</h2>
            <p>Pilih metode pembayaran invoice Anda.</p>
          </div>
        </div>
        <div class="self-payment" id="self-payment"></div>
      </section>

      <section class="panel tracking-card">
        <div class="panel-head">
          <div>
            <h2>Before / After</h2>
            <p>Dokumentasi pengerjaan dari ZOLIX.</p>
          </div>
        </div>
        <div class="media-grid tracking-media" id="tracking-media"></div>
      </section>
    </main>

    <script src="/static/tracking.js"></script>
  </body>
</html>
