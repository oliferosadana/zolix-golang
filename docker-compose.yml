services:
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:2.14.0
    container_name: nginx-proxy-manager
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    environment:
      TZ: "${TZ:-Asia/Makassar}"
      DISABLE_IPV6: "true"
    volumes:
      - /data/nginx-proxy-manager/data:/data
      - /data/nginx-proxy-manager/letsencrypt:/etc/letsencrypt
    networks:
      - proxy

  waha:
    image: devlikeapro/waha:latest
    container_name: waha
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      WAHA_API_KEY: "${WAHA_API_KEY}"
      WAHA_DASHBOARD_USERNAME: "${WAHA_DASHBOARD_USERNAME:-admin}"
      WAHA_DASHBOARD_PASSWORD: "${WAHA_DASHBOARD_PASSWORD}"
      WAHA_PRINT_QR: "false"
      TZ: "${TZ:-Asia/Makassar}"
    volumes:
      - /data/waha:/app/.sessions
    networks:
      - proxy

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zolix-app
    restart: unless-stopped
    environment:
      PORT: "8080"
      JWT_SECRET: "${JWT_SECRET}"
      UPLOAD_DIR: "/app/uploads"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL}"
      WAHA_BASE_URL: "http://waha:3000"
      WAHA_API_KEY: "${WAHA_API_KEY}"
      WAHA_SESSION: "${WAHA_SESSION:-default}"
      STORE: postgres
      DATABASE_URL: "${DATABASE_URL}"
    ports:
      - "8090:8080"
    volumes:
      - ./assets:/app/assets:ro
      - /data/zolix/uploads:/app/uploads
    depends_on:
      - waha
    networks:
      - proxy

networks:
  proxy:
    name: zolix_proxy
